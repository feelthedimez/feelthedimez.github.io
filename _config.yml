# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Tebogo Tema
email: dime.tema@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Tebogo Tema is a software engineer in progress. The purpose of this blog/website is to document my journey, 
  feelings, thoughts and everything inbetween regarding software & design.
baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://feelthedimez.github.io" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: feelthedimez
linkedin_username: Tebogo Tema
github_username: feelthedimez
author: Tebogo Tema
google_analytics: G-QM8BK0YT4S

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM

copyright: Tebogo Tema

# Post categories. Every post sets `category:` to one of these names.
# The page URL is the name slugified (QA & Automation -> /qa-automation/),
# and each category has a matching page under pages/.
categories_list:
  - name: Software Engineering
    description: Building software, the decisions behind it, and what I keep getting wrong.
  - name: QA & Automation
    description: Testing, test automation, CI pipelines, and making quality a habit instead of a gate.
  - name: Homelab
    description: Running a self-hosted cloud on a spare PC. Hardware, Linux, storage, networking, and the services I end up hosting.
  - name: AI & Knowledge
    description: Working with AI tools, building on top of them, and keeping a second brain that actually answers back.
  - name: Personal
    description: Career, growth, creativity, and the thoughts in between.

# How many posts get a full excerpt on the home page.
latest_posts_count: 3
# Rows shown in the current year before "show more".
compact_list_initial_rows: 8

plugins:
  - jekyll-feed
  - jekyll-seo-tag
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
